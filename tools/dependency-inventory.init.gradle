import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.tasks.register("exportDependencyInventory") {
        group = "verification"
        description = "Exports selected public Maven coordinates; no application source or private data."
        doLast {
            def coordinates = { configuration ->
                def resolution = configuration.incoming.resolutionResult
                def unresolved = resolution.allDependencies.findAll { it instanceof UnresolvedDependencyResult }
                if (!unresolved.isEmpty()) {
                    throw new GradleException("Incomplete dependency inventory: ${configuration.name}", unresolved.first().failure)
                }
                resolution.allComponents.collect { component ->
                    def id = component.id
                    id instanceof ModuleComponentIdentifier ? "${id.group}:${id.module}:${id.version}".toString() : null
                }.findAll { it != null }.unique().sort()
            }
            def app = root.project(":app")
            def inventory = [generatedAtUtc: java.time.Instant.now().toString()]
            [
                releaseRuntime: [app, "releaseRuntimeClasspath"],
                debugRuntime: [app, "debugRuntimeClasspath"],
                unitTestRuntime: [app, "debugUnitTestRuntimeClasspath"],
                instrumentationRuntime: [app, "debugAndroidTestRuntimeClasspath"],
                benchmarkAppRuntime: [app, "benchmarkRuntimeClasspath"],
                benchmarkTestRuntime: [root.project(":benchmark"), "benchmarkRuntimeClasspath"],
                spikeRuntime: [root.project(":spike"), "debugRuntimeClasspath"],
                audioTestRuntime: [root.project(":audio"), "testRuntimeClasspath"],
                loggingTestRuntime: [root.project(":logging"), "testRuntimeClasspath"]
            ].each { name, target ->
                inventory[name] = coordinates(target[0].configurations.getByName(target[1]))
            }
            inventory.buildPlugins = root.allprojects.collectMany { project ->
                coordinates(project.buildscript.configurations.getByName("classpath"))
            }.unique().sort()
            def output = root.layout.buildDirectory.dir("dependency-inventory").get().asFile
            output.mkdirs()
            if (!output.isDirectory()) throw new GradleException("Cannot create dependency inventory directory")
            new File(output, "inventory.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson(inventory)), "UTF-8")
            inventory.findAll { it.key != "generatedAtUtc" }.each { name, values ->
                def components = values.collect { coordinate ->
                    def (group, artifact, version) = coordinate.split(":")
                    [type: "library", group: group, name: artifact, version: version,
                        purl: "pkg:maven/${group}/${artifact}@${version}"]
                }
                def bom = [bomFormat: "CycloneDX", specVersion: "1.5", version: 1, components: components]
                new File(output, "${name}.cdx.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson(bom)), "UTF-8")
                println("${name}: ${values.size()} selected public coordinates")
            }
        }
    }
}
